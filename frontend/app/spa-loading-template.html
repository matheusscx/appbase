<!--
  Lo que se ve mientras baja el bundle, ahora que la app es SPA (ADR-017).
  Sin esto la carga dura arranca en blanco: el SSR al menos pintaba el shell.

  HTML crudo fuera de Vue: no hay tokens del design system acá, y por eso los
  colores están al mínimo —un gris neutro que funciona sobre el fondo claro que
  el `colorMode` fija por defecto—. No es una excepción al design system: es
  código que corre antes de que el design system exista.
-->
<div style="display:flex;align-items:center;justify-content:center;height:100vh">
  <svg width="40" height="40" viewBox="0 0 40 40" aria-label="Cargando" role="img">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#e5e5e5" stroke-width="4" />
    <circle cx="20" cy="20" r="16" fill="none" stroke="#737373" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="25 75">
      <animateTransform attributeName="transform" type="rotate" from="0 20 20"
                        to="360 20 20" dur="0.9s" repeatCount="indefinite" />
    </circle>
  </svg>
</div>

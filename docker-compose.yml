version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# UN STACK POR WORKTREE. Los puertos publicados y el prefijo de los contenedores
# salen de variables cuyos **defaults son los valores históricos**, así que el
# checkout principal no distingue este archivo del anterior.
#
# Lo que NO va acá: `COMPOSE_PROJECT_NAME`. Fijarlo en `.env.example` fue la causa
# raíz del incidente del 2026-09-20 —cada worktree copió el ejemplo, heredó el
# mismo proyecto de compose, y un `reset-db.sh` hacía `down -v` sobre los
# contenedores de todas las sesiones—. Sin esa línea, el default de compose es el
# nombre del directorio: único por worktree por construcción.
#
# Y `container_name` sigue existiendo A PROPÓSITO. Sin nombre fijo, un worktree que
# se olvide del setup adopta EN SILENCIO los contenedores de otro; con nombre fijo
# ese caso choca ruidoso. De los dos, es el que falla en la dirección correcta.
#
# Los puertos los reparte `scripts/entorno.sh` con un offset por worktree; main es
# el offset 0. `scripts/check-aislamiento.mjs` falla si vuelve a aparecer un puerto
# o un nombre literal acá.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ========================================
  # POSTGRESQL DATABASE
  # ========================================
  postgres:
    # La misma versión mayor que el demo de Railway (18.6 Debian) y que CI. Debian y
    # no alpine: la alpine ordena el texto por bytes (musl) y el demo no.
    image: postgres:18
    container_name: ${PREFIJO_CONTENEDOR:-tecnica}_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-tecnica_db}
      POSTGRES_USER: ${DB_USER:-dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_123}
    ports:
      - "${PUERTO_POSTGRES:-5432}:5432"
    volumes:
      # Desde la 18 la imagen guarda los datos en /var/lib/postgresql/18/docker y
      # declara el volumen en /var/lib/postgresql: montado en …/data, la base
      # quedaría afuera del volumen nombrado, sin error.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev_user} -d ${DB_NAME:-tecnica_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tecnica_network

  # ========================================
  # BACKEND (NestJS)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${PREFIJO_CONTENEDOR:-tecnica}_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # ⚠️ NO sale del `.env`, y es deliberado. El `DATABASE_URL` del `.env` es la
      # verdad DEL HOST —`localhost:<PUERTO_POSTGRES>`, que es lo que usan los `npm`
      # de backend/— y adentro del contenedor `localhost` es el contenedor mismo. Una
      # variable con dos significados fue lo que hizo que `backend/test/setup-env.ts`
      # necesite traducir `@postgres:` → `@localhost:`, traducción que **no mueve el
      # puerto** y por lo tanto no sirve para un worktree con su Postgres en 54xx.
      # Acá se arma la URL INTERNA contra el servicio `postgres`, que es lo único que
      # el contenedor puede alcanzar. Resuelve idéntico a lo de antes para main.
      DATABASE_URL: postgresql://${DB_USER:-dev_user}:${DB_PASSWORD:-dev_password_123}@postgres:5432/${DB_NAME:-tecnica_db}
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      PORT: 3000
      API_PREFIX: ${API_PREFIX:-/api}
      PASARELA_ENCRYPTION_KEY: ${PASARELA_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      QZ_PRIVATE_KEY: ${QZ_PRIVATE_KEY:-}
      QZ_CERTIFICATE: ${QZ_CERTIFICATE:-}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${PUERTO_BACKEND:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    networks:
      - tecnica_network
    restart: unless-stopped

  # ========================================
  # FRONTEND (Vue3 + Vite)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${PREFIJO_CONTENEDOR:-tecnica}_frontend
    ports:
      - "${PUERTO_FRONTEND:-5173}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # `.nuxt` propio del contenedor, igual que `node_modules`. Compartido con el host,
      # un `nuxt prepare` del host (el postinstall de `npm ci`) que reescribe `.nuxt`
      # poco antes de que arranque el `nuxt dev` del contenedor lo hace fallar con
      # `ENOENT` al escribir `nuxt-fonts-global.css`, y el contenedor se reinicia: 5 de 7
      # corridas sin esto, 0 de 5 con esto (2026-10-09, `docs/agent/resueltos.md`).
      - /app/.nuxt
    environment:
      # El navegador ya NO llega al backend por su cuenta: pide `/api` a este
      # mismo servicio y `server/api/[...].ts` lo reenvía. Por eso el destino sí
      # es la red interna de Docker —el proxy corre adentro del contenedor— y
      # por eso volvió a haber una variable de servidor donde ADR-017 había
      # borrado `API_INTERNAL_URL`: aquella era para RENDERIZAR, ésta es para
      # TRANSPORTAR. Ver ADR-022.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://backend:3000}
      VITE_APP_NAME: ${VITE_APP_NAME:-Prueba Técnica}
    command: npm run dev -- --host
    depends_on:
      - backend
    networks:
      - tecnica_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  tecnica_network:
    driver: bridge

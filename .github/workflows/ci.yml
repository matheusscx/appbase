name: CI

# Backstop del lado del servidor: corre el gate determinista en cada push a main,
# sin depender de que el agente/dev invoque verify-feature localmente.
# Lo que NO puede correr acá (revisión de juicio: N+1, dinero-Decimal, alcance) vive
# en el sub-agente de verify-feature (paso 7).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Tope propio, no el default de 6 horas de GitHub. El caso que lo justifica:
    # un entorno Nuxt colgado tarda hasta un minuto por archivo en reportarse
    # (`hookTimeout` 60s) y hay 22 `.nuxt.spec.ts`, así que un cuelgue general se
    # arrastraría muchísimo antes de fallar. El número tiene que dejar margen al
    # job en verde: con 25 lo cortó el 2026-10-08 con todos los tests pasados
    # (22-22,5 min en los verdes previos, y la suite crece con cada frente). Si un
    # verde vuelve a acercarse al tope, se sube con la medición al lado.
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # El esquema lo arman las migraciones (ADR-030); el seeder corre al bootstrap.
      DATABASE_URL: postgres://appuser:apppass@localhost:5432/appdb
      NODE_ENV: test
      API_PREFIX: api
      PORT: '3000'
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_REFRESH_SECRET: ci-only-not-a-real-refresh-secret
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      # El navegador no tiene URL de backend: pide `/api` al frontend y el
      # proxy de Nitro reenvía acá (ADR-022). En CI los dos servidores viven
      # en el mismo host, así que el destino es localhost.
      API_PROXY_TARGET: http://localhost:3000
      # CredencialesService (módulo pasarela) tira error en el constructor si falta
      # → sin esto, todo test e2e muere al bootear AppModule. Valor de test (32 bytes b64).
      PASARELA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ── Docs ─────────────────────────────────────────────────────────────
      # Falla rápido si la doc del proyecto tiene enlaces internos rotos (sin deps).
      - name: docs · enlaces internos
        run: node scripts/check-docs-links.mjs

      # ── Aislamiento del entorno de desarrollo ────────────────────────────
      # Backstop del frente "un stack por worktree" (2026-09-20). Que cada worktree
      # tenga su propio proyecto de compose no se sostiene solo: alcanza con que
      # alguien "simplifique" un `"5432:5432"` para volver al punto de partida, y el
      # síntoma recién aparece cuando dos sesiones se pisan. Éste es el único de los
      # tres niveles de verificación que no depende de invocarlo a mano.
      - name: entorno · aislamiento por worktree
        run: node scripts/check-aislamiento.mjs

      # ── Secretos ─────────────────────────────────────────────────────────
      # El repo es público. El pre-commit mira lo staged, pero se saltea con
      # --no-verify y no corre en un rebase; esto mira el árbol del push entero.
      # No ve un secreto que entró y salió dentro del mismo push, ni el de un push
      # cuyo run canceló el siguiente (`concurrency`): ya está publicado en el
      # historial, y lo que corresponde es rotarlo. Un `paths-ignore` de docs dejaría
      # sin escanear justamente los .md.
      - name: secretos · archivos versionados
        run: node scripts/check-secretos.mjs

      # ── Backend ──────────────────────────────────────────────────────────
      - name: backend · install
        working-directory: backend
        run: npm ci

      - name: backend · lint:check
        working-directory: backend
        run: npm run lint:check

      - name: backend · typecheck
        working-directory: backend
        run: npm run typecheck

      - name: backend · unit tests
        working-directory: backend
        run: npm test

      # Una entity cambiada sin su migración frena acá, antes del e2e, con la migración
      # que falta impresa en el log (ADR-030). Va contra la base de este job, recién
      # creada: `migration:run` la arma desde cero y `migration:check` compara contra
      # las entities. Después el e2e arranca la app sobre esa misma base, que ya no
      # tiene migraciones pendientes.
      - name: backend · migraciones al día con las entities
        working-directory: backend
        run: npm run migration:run && npm run migration:check

      - name: backend · e2e (Postgres real)
        working-directory: backend
        run: npm run test:e2e

      # ── Frontend ─────────────────────────────────────────────────────────
      - name: frontend · install
        working-directory: frontend
        run: npm ci

      - name: frontend · build
        working-directory: frontend
        run: npm run build

      # Los specs de composables (conversión de unidades, formato de dinero) no
      # corrían en CI: eran decorativos. `vitest.config.ts` excluye `e2e/`, que
      # es de Playwright.
      - name: frontend · unit
        working-directory: frontend
        run: npm test

      # Bloqueante: `vue-tsc` y `typescript` están pineados exactos como devDependencies
      # (3.3.7 / 6.0.3), así `nuxi typecheck` resuelve ambos localmente y NO cae al
      # fallback `npx -p vue-tsc -p typescript` (que en CI bajaba @latest de ambos →
      # typescript@7, incompatible → ERR_PACKAGE_PATH_NOT_EXPORTED './lib/tsc'). El pin
      # hace la resolución determinista; el ratchet impide que la deuda de tipos crezca.
      - name: frontend · typecheck ratchet
        working-directory: frontend
        run: npm run typecheck:ratchet

      - name: frontend · design tokens
        working-directory: frontend
        run: npm run design:check

  # Vulnerabilidades conocidas en las dependencias (`npm audit`). Job aparte y no un paso
  # de `gate`: `npm audit` lee el lockfile y no necesita `npm ci` ni Postgres, así que
  # corre en segundos y en paralelo; y un rojo acá se lee como "dependencias", sin
  # mezclarse con los tests. Qué bloquea, qué solo reporta y qué pasa si el registry no
  # contesta: cabecera de `scripts/check-dependencias.mjs`.
  dependencias:
    runs-on: ubuntu-latest
    # Medido en local: 7 s con el registry sano, 33 s caído y 2 min 30 s colgado (el
    # script corta cada consulta a los 20 s). Los dos últimos terminan en aviso, no en
    # este timeout.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23'

      - name: npm audit · backend y frontend
        run: node scripts/check-dependencias.mjs

  # Suite E2E de navegador (Playwright). Job separado a propósito: GitHub crea los
  # `services` por job, así que este Postgres nace virgen y el bootstrap del backend lo
  # siembra — la misma garantía que `scripts/reset-db.sh` da en local. Correrlo dentro de
  # `gate` lo dejaría sobre la base que `backend · e2e` acaba de mutar (cajas abiertas,
  # stock consumido) y las aserciones de UI dejarían de ser deterministas.
  e2e-navegador:
    runs-on: ubuntu-latest
    # Mismo motivo que `gate`: un Playwright que no arranca no puede quedarse
    # seis horas ocupando un runner.
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: appuser
          POSTGRES_PASSWORD: apppass
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U appuser -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://appuser:apppass@localhost:5432/appdb
      NODE_ENV: test
      API_PREFIX: api
      PORT: '3000'
      JWT_SECRET: ci-only-not-a-real-secret
      JWT_REFRESH_SECRET: ci-only-not-a-real-refresh-secret
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      # El navegador no tiene URL de backend: pide `/api` al frontend y el
      # proxy de Nitro reenvía acá (ADR-022). En CI los dos servidores viven
      # en el mismo host, así que el destino es localhost.
      API_PROXY_TARGET: http://localhost:3000
      PASARELA_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      # Límites de intentos (ADR-032): la suite entra cientos de veces con el
      # mismo admin y chocaría el de login en el primer minuto. El e2e de API no
      # lo necesita acá: lo fija `backend/test/setup-env.ts`. El secreto hace que
      # el proxy del frontend le nombre el cliente al backend, como en Railway.
      LIMITES_ESCALA: '1000'
      PROXY_SECRETO: ci-only-not-a-real-secret

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.23'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: backend · install
        working-directory: backend
        run: npm ci

      - name: backend · build
        working-directory: backend
        run: npm run build

      - name: frontend · install
        working-directory: frontend
        run: npm ci

      - name: frontend · build
        working-directory: frontend
        run: npm run build

      - name: playwright · chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # `webServer` de la config arranca backend y frontend y espera a que respondan.
      - name: frontend · e2e navegador
        working-directory: frontend
        run: npm run e2e

      # Sin esto, `trace: 'on-first-retry'` y `screenshot: 'only-on-failure'` no sirven
      # de nada: un CI rojo quedaría sin forma de diagnosticarse.
      - name: reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
